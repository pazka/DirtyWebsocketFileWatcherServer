version: 2
updates:
  # Security and version updates for the 2019-era dependencies; majors stay separate PRs.
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: monthly }
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    groups:
      actions:
        patterns: ["*"]
